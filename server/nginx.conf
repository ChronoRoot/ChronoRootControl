server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # MJPEG is an open-ended response. Never accumulate camera frames in nginx:
    # each boundary should be forwarded to the browser as soon as uWSGI emits it.
    location ^~ /preview/video_feed/ {
        include uwsgi_params;
        uwsgi_pass unix:/run/uwsgi/app/ChronoRootControl/socket;
        uwsgi_buffering off;
        gzip off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Accel-Buffering "no" always;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass unix:/run/uwsgi/app/ChronoRootControl/socket;
    }
}   